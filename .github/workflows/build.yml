name: Build HongGuo Tweak

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip dpkg-dev perl xz-utils

      - name: Clone Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS toolchain (clang)
        run: |
          # 使用正确的 Linux 工具链包 (zip)
          curl -L https://developer.angelxwind.net/Linux/ios-toolchain_clang+llvm+ld64_latest_linux_x86_64.zip -o toolchain.zip
          mkdir -p $HOME/theos/toolchain/linux/iphone
          unzip -q toolchain.zip -d $HOME/theos/toolchain/linux/iphone
          rm toolchain.zip

      - name: Download iOS SDKs
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mkdir -p $HOME/theos/sdks
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf sdks-master sdks.zip

      - name: Build package
        run: |
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFullScreen.deb
          path: packages/*.deb
