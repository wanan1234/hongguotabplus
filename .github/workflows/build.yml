# .github/workflows/build.yml
name: Build HongGuo Tweak

on:
  push:
    branches: [ main ]
  # 可选：当你创建 Release 时也会触发构建
  # release:
  #   types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用 theos-action 一键设置 Theos 环境
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          # 指定 Theos 的安装路径，默认是 'theos'
          theos-dir: 'theos'
          # 指定 SDK 仓库，默认是 'https://github.com/theos/sdks'
          theos-sdks: 'https://github.com/theos/sdks'

      # 构建插件
      - name: Build package
        run: |
          # 让 make 命令能找到我们刚安装的 Theos
          export THEOS=$(pwd)/theos
          make package

      # 上传生成的 .deb 包
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFullScreen.deb
          path: packages/*.deb
