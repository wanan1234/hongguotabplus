name: Build HongGuo Tweak

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip dpkg-dev perl

      - name: Install Theos (with submodules)
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          # 确保 dm.pl 符号链接有效
          if [ -L "$HOME/theos/bin/dm.pl" ]; then
            realpath "$HOME/theos/bin/dm.pl" || {
              echo "dm.pl link broken, installing manually"
              curl -L -o "$HOME/theos/bin/dm.pl" https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl
            }
          fi
          chmod +x $HOME/theos/bin/dm.pl

      - name: Install iOS SDK
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip sdks.zip -d $HOME/theos/sdks
          mv $HOME/theos/sdks/sdks-master/* $HOME/theos/sdks/
          rm -rf $HOME/theos/sdks/sdks-master

      - name: Build package
        run: |
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFullScreen.deb
          path: packages/*.deb
