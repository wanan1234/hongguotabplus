name: Build HongGuo Tweak

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip wget dpkg-dev perl

      - name: Install Theos (official installer)
        run: |
          curl -LO https://github.com/theos/installer/raw/master/install.sh
          chmod +x install.sh
          # 安装到 /opt/theos，避免权限问题
          sudo ./install.sh --prefix /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH
          # 确保 sdks 目录存在
          sudo mkdir -p /opt/theos/sdks
          sudo chown -R runner:runner /opt/theos

      - name: Build package
        run: |
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFullScreen.deb
          path: packages/*.deb
