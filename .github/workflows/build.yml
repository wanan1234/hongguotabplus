name: Build HongGuo Tweak

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip dpkg-dev perl python3

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install iOS toolchain (clang)
        run: |
          # 下载预编译的 iOS toolchain (从 Theos 官方)
          curl -L https://github.com/theos/toolchain/releases/download/v1.0.0/linux-ios-clang.tar.xz -o toolchain.tar.xz
          tar -xf toolchain.tar.xz -C $HOME/theos
          # 设置符号链接
          ln -sf $HOME/theos/toolchain/linux/ios/iphone $HOME/theos/toolchain/linux/iphone
          # 确保 clang 可执行
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/clang

      - name: Install iOS SDK (iPhoneOS.sdk)
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip sdks.zip -d $HOME/theos/sdks
          mv $HOME/theos/sdks/sdks-master/* $HOME/theos/sdks/
          rm -rf $HOME/theos/sdks/sdks-master

      - name: Build
        run: |
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFullScreen.deb
          path: packages/*.deb
